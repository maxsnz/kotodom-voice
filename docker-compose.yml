version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: voice
    container_name: voice
    # network_mode: host — telegraf долбит api.telegram.org через
    # long-polling, никаких портов не слушает. Хост-режим выбран для
    # единообразия с другими ботами на этом сервере (tasker, reminder).
    network_mode: host
    restart: unless-stopped
    env_file: .env
    healthcheck:
      # Проверяем свежесть liveness-heartbeat, который приложение обновляет
      # каждые 15с (см. runBot в src/bot.ts), а не просто наличие bun-процесса:
      # процесс может быть жив, а event loop — завис (telegraf+Bun роняет
      # polling на сетевом сбое), и старый pgrep-чек этого не ловил. Если
      # heartbeat не обновлялся >1 мин → unhealthy. find/-mmin есть в
      # oven/bun:debian (procps/pgrep — не гарантирован).
      test: ["CMD-SHELL", "test -n \"$(find /tmp/voice-heartbeat -mmin -1 2>/dev/null)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Ротация логов настраивается глобально в /etc/docker/daemon.json
    # (infra/roles/docker), per-service блок не нужен.
